[project]
name = "novel-translator"
version = "0.1.0"
description = "AI Novel Translation Studio with Temporal GraphRAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "neo4j>=5.28,<6.0",
    "qdrant-client>=1.15,<2.0",
    "redis>=6.4,<7.0",
    "minio>=7.2,<8.0",
    "httpx>=0.28,<1.0",
    "structlog>=25.4,<26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
    "pre-commit>=4.3,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
